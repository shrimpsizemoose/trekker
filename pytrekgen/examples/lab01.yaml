lab:
  id: "01"
  name: "Web Service Lab"
  env_prefix: "NPL"

required_env:
  - name: STUDENT
    error: "Мне надо знать, как тебя зовут ващемпто"
  - name: TOKEN
    error: "Мне нужен токен, чтобы убедиться что ты это ты"
  - name: COHORT
    error: "Мне надо также знать, из какой ты когорты (задай NPL_COHORT)"
  - name: LAB01_EXTERNAL_IP
    error: "Если нет айпишника, то я не знаю, куда мне постучаться"

optional_env:
  - name: LAB01_WEB_PORT
    default: "8000"
    message: "использую порт по умолчанию"

usage_header: |
  🤌 Чекер конфигурируется через переменные окружения

usage_vars: |
  ${ENV_PREFIX}_LAB01_EXTERNAL_IP - внешний адрес вашей машины
  ${ENV_PREFIX}_LAB01_WEB_PORT - порт, по которому будет работать вебсервер (если не задать, то будет 8000)
  ${ENV_PREFIX}_STUDENT - ваше имя, как логин в ЛК (например herbie.hancock)
  ${ENV_PREFIX}_COHORT - ваша когорта, например, DE99 (большими буквами)
  ${ENV_PREFIX}_TOKEN - ваш секретный токен, например, sk-npl-Ha266QtZXDE99BnKo....ABC

  Переменные проще сохранить в файл и оттуда уже давать чекеру
  Например, можно создать файл env.conf
  Потом написать туда несколько строк типа
    NPL_LAB01_EXTERNAL_IP=12.15.63.124
    NPL_LAB01_WEB_PORT=8888
    NPL_STUDENT=herbie.hancock
    NPL_COHORT=DE99
    NPL_TOKEN=sk-npl-Ha266QtZXDE99BnKo....ABC

usage_docker: |
  И потом подсунуть его докеру через --env-file env.conf
    docker run --rm -it --env-file env.conf ${IMAGE}

  А если есть подозрения, что не работает что-то с сетью, то может надо будет добавить
  флаг --net=host в команду запуска (сразу после run), но скорее всего не понадобится

usage_debug: |
  Напоминаем также, что при возникновении проблем следует обратиться к мануалу по дебагу вот тут:
  ${DEBUG}

confirm_display:
  - name: STUDENT
  - name: COHORT
  - name: TOKEN
    masked: true
  - name: LAB01_EXTERNAL_IP
  - name: LAB01_WEB_PORT

analytics:
  skip_tls: true
  common_data:
    NPL_LAB01_EXTERNAL_IP: LAB01_EXTERNAL_IP
    NPL_COHORT: COHORT
  headers:
    x-secret: "I know stuff, okay?"
    x-npl-lab: "01"
    x-npl-student: "env:STUDENT"
    Authorization: "Bearer env:TOKEN"

checks:
  - type: http_get
    name: base_url_check
    url: "http://${LAB01_EXTERNAL_IP}:${LAB01_WEB_PORT}"
    expected_status: 200
    message_before: "Сначала проверю просто, что по адресу отвечает статусом OK"
    message_success: "Вроде тут ок 🎷🐍"
    on_request: "010_base_request_sent"
    on_response: "015_base_response_received"
    on_failure:
      event: "016_base_check_failed"
      message: "Проверка не обратилась успехом, ожидал статус 200 OK"
    on_success:
      event: "020_base_check_passed"

  - type: http_get_random_path
    name: random_404_check
    url: "http://${LAB01_EXTERNAL_IP}:${LAB01_WEB_PORT}"
    expected_status: 404
    message_before: "Теперь проверяю, что рандомный адрес отвечает статусом 404 Not Found"
    message_success: "Всё как я и ожидаю, ура 🎷🐂"
    on_request: "030_random_request_sent"
    on_response: "035_random_response_received"
    on_failure:
      event: "036_random_check_failed"
      message: "Проверка не обратилась успехом, ожидал статус 404 Not Found"
    on_success:
      event: "040_random_check_passed"

  - type: http_get
    name: student_path_check
    url: "http://${LAB01_EXTERNAL_IP}:${LAB01_WEB_PORT}/${STUDENT}-${COHORT}"
    expected_status: 200
    message_before: "Продолжаю. Теперь наконец проверяю персональный адрес"
    message_success: "Вроде тут тоже получилось 🎷🐊"
    on_request: "050_student_request_sent"
    on_response: "055_student_response_received"
    on_failure:
      event: "056_student_check_failed"
      message: "Проверка не обратилась успехом, ожидал статус 200 OK"
    on_success:
      event: "060_student_check_passed"

success_message: "Всё супер! Если видишь это сообщение, значит лаба сдана 🐩🐈🌭"
