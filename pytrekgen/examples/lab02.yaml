lab:
  id: "02"
  name: "Kafka Pipeline Lab"
  env_prefix: "NPL"

build:
  module: github.com/newprolab/de_labs/checkers/lab-02
  go_version: "1.23"

required_env:
  - name: STUDENT
    error: "Мне надо знать, как тебя зовут"
  - name: TOKEN
    error: "Мне нужен токен, чтобы убедиться что ты это ты"
  - name: LAB02_KAFKA_ADDR
    error: "Нужен адрес кафки"
  - name: LAB02_KAFKA_TOPIC
    error: "Нужно имя топика"
  - name: LAB02_DB_URL
    error: "Нужен URL базы данных"

optional_env_int:
  - name: KAFKA_BATCH_SIZE
    default: 100
    message: "использую размер батча по умолчанию"
  - name: KAFKA_BATCH_NOM_NOM_DELAY_MS
    default: 0
    message: "не жду между отправкой батчей"

flags:
  - name: send-only
    type: bool
    default: "false"
    description: "только отправлять сообщения в кафку, без проверки PostgreSQL"
  - name: small
    type: bool
    default: "false"
    description: "отправить малый набор сообщений (для быстрой проверки)"

usage_header: |
  🤌 Чекер конфигурируется через переменные окружения

usage_vars: |
  ${ENV_PREFIX}_LAB02_KAFKA_ADDR - адрес кафки (например kafka.example.com:9092)
  ${ENV_PREFIX}_LAB02_KAFKA_TOPIC - имя топика в кафке
  ${ENV_PREFIX}_LAB02_DB_URL - URL базы данных postgres
  ${ENV_PREFIX}_STUDENT - ваше имя, как логин в ЛК (например herbie.hancock)
  ${ENV_PREFIX}_TOKEN - ваш секретный токен, например, sk-npl-Ha266QtZXDE99BnKo....ABC

  Опциональные переменные, которые можно попробовать поменять, если что-то не работает
  ${ENV_PREFIX}_KAFKA_BATCH_SIZE - по сколько сообщений слать за раз (например, 1000)
  ${ENV_PREFIX}_KAFKA_BATCH_NOM_NOM_DELAY_MS - сколько ждать (в миллисекундах) после отправки пакета

  Переменные проще сохранить в файл и оттуда уже давать чекеру
  Например, можно создать файл env.conf и написать туда:
    NPL_LAB02KAFKA_ADDR=kafka.example.com:9092
    NPL_LAB02KAFKA_TOPIC=my_topic
    NPL_LAB02_DB_URL=postgres://user:pass@host:5432/dbname
    NPL_STUDENT=herbie.hancock
    NPL_TOKEN=sk-npl-b82...................b3
    NPL_KAFKA_BATCH_SIZE=50
    NPL_KAFKA_BATCH_NOM_NOM_DELAY_MS=300

usage_docker: |
  И потом подсунуть его докеру через --env-file env.conf
    docker run --rm -it --env-file env.conf ${IMAGE}
  Флаг -send-only отправит только сообщения в кафку без проверки постгреса
  Флаг -small включает отправку малого набора сообщений (быстрый тест пайплайна)

usage_debug: |
  Напоминаем также, что при возникновении проблем следует обратиться к мануалу по дебагу:
  ${DEBUG}

confirm_display:
  - name: STUDENT
  - name: TOKEN
    masked: true
  - name: LAB02_KAFKA_ADDR
  - name: LAB02_KAFKA_TOPIC
  - name: LAB02_DB_URL
    masked: true

analytics:
  skip_tls: true
  common_data:
    kafka_url: LAB02_KAFKA_ADDR
    kafka_topic: LAB02_KAFKA_TOPIC
  headers:
    x-secret: "I know stuff, okay?"
    x-npl-lab: "02"
    x-npl-student: "env:STUDENT"
    Authorization: "Bearer env:TOKEN"

checks:
  - type: kafka_topic_exists
    name: check_topic
    kafka_addr_env: LAB02_KAFKA_ADDR
    kafka_topic_env: LAB02_KAFKA_TOPIC
    on_connect: "005_kafka_connected"
    on_partitions_read: "006_kafka_partitions_read"
    on_success:
      event: "007_topic_exists"

  - type: postgres_connect
    name: connect_db
    postgres_url_env: LAB02_DB_URL
    on_connect: "010_postgres_connected"
    skip_on_flag: send-only

  - type: postgres_tables_empty
    name: check_tables_empty
    postgres_url_env: LAB02_DB_URL
    tables:
      - f_hourly_post_stats
      - f_hourly_user_stats
    message_before: "Проверяю что таблицы пустые"
    on_start: "015_checking_tables"
    on_success:
      event: "020_tables_empty"
    skip_on_flag: send-only

  - type: custom
    name: run_pipeline
    func: runPipelineTest

success_message: "Все проверки успешно пройдены! 🎉"

custom_code:
  imports:
    - encoding/json
  types_file: lab02_types.go
  code_file: lab02_code.go
