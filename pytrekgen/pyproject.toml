[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytrekgen"
version = "0.1"
description = "Python-based code generator for trekker lab checkers"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
]

[project.scripts]
pytrekgen = "pytrekgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pytrekgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
